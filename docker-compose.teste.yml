services:
  # ==========================================
  # BASE DE DATOS (SOLO PARA DESARROLLO LOCAL)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: trazabilidad-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trazabilidad
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - trazabilidad-local-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # REDIS (SOLO PARA DESARROLLO LOCAL)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: trazabilidad-local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    networks:
      - trazabilidad-local-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_local_data:
    name: trazabilidad-local-postgres-data
  redis_local_data:
    name: trazabilidad-local-redis-data

networks:
  trazabilidad-local-network:
    name: trazabilidad-local-network
    driver: bridge
