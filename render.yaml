# render.yaml — Infraestructura como código para Render.com
# Documentación: https://render.com/docs/render-yaml-reference
#
# SERVICIOS:
#   1. backend  → Web Service (Docker, Node.js/Express + Prisma)
#   2. frontend → Web Service (Docker, Next.js standalone)
#
# BASES DE DATOS GESTIONADAS POR RENDER:
#   3. postgres → PostgreSQL 16
#   4. redis    → Redis 7

databases:
  - name: trazabilidad-postgres
    databaseName: trazabilidad
    user: trazabilidad_user
    plan: free            # Cambiar a "starter" o superior en producción real
    region: frankfurt     # eu-central-1 — más cercano a España
    ipAllowList: []        # Permite conexión solo desde servicios de Render

services:
  # ──────────────────────────────────────────────────────────────────────────
  # REDIS (Render Key-Value Store)
  # ──────────────────────────────────────────────────────────────────────────
  - type: redis
    name: trazabilidad-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ──────────────────────────────────────────────────────────────────────────
  # BACKEND — Express + Prisma (Docker)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: trazabilidad-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free             # Cambiar a "starter" para evitar sleep en producción
    healthCheckPath: /health
    autoDeploy: true       # CD automático al hacer push a la rama main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_PREFIX
        value: /api/v1
      # Base de datos (referencia al servicio gestionado de Render)
      - key: DATABASE_URL
        fromDatabase:
          name: trazabilidad-postgres
          property: connectionString
      # Redis (referencia al servicio gestionado de Render)
      - key: REDIS_URL
        fromService:
          name: trazabilidad-redis
          type: redis
          property: connectionString
      # JWT — GENERAR VALORES SEGUROS Y ESTABLECERLOS EN EL DASHBOARD DE RENDER
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      # CORS — apunta al dominio del frontend
      - key: CORS_ORIGIN
        fromService:
          name: trazabilidad-frontend
          type: web
          property: host
          envVarKey: CORS_ORIGIN_FORMATTED
      # QR base URL
      - key: QR_BASE_URL
        fromService:
          name: trazabilidad-frontend
          type: web
          property: host
          envVarKey: QR_BASE_FORMATTED
      # Email (configurar manualmente en el dashboard con SendGrid/Mailtrap)
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: apikey
      - key: SMTP_PASS
        sync: false   # SECRETO: definir en el dashboard de Render
      - key: EMAIL_FROM
        value: noreply@trazabilidad.com
      # AWS S3 (opcional — para documentos)
      - key: AWS_REGION
        value: eu-west-1
      - key: AWS_ACCESS_KEY_ID
        sync: false   # SECRETO: definir en el dashboard de Render
      - key: AWS_SECRET_ACCESS_KEY
        sync: false   # SECRETO: definir en el dashboard de Render
      - key: AWS_S3_BUCKET
        value: trazabilidad-docs
      # Logging
      - key: LOG_LEVEL
        value: info
      - key: LOG_DIR
        value: /app/logs
      - key: UPLOAD_DIR
        value: /app/uploads

  # ──────────────────────────────────────────────────────────────────────────
  # FRONTEND — Next.js Standalone (Docker)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: trazabilidad-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: frankfurt
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # URL del backend — referencia interna de Render (comunicación privada)
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: trazabilidad-backend
          type: web
          property: host
          envVarKey: NEXT_PUBLIC_API_URL_FORMATTED
      - key: NEXT_PUBLIC_APP_NAME
        value: Sistema de Trazabilidad Alimentaria
      # La URL pública del propio frontend
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: trazabilidad-frontend
          type: web
          property: host
          envVarKey: NEXT_PUBLIC_APP_URL_FORMATTED
      - key: NEXT_PUBLIC_QR_BASE_URL
        fromService:
          name: trazabilidad-frontend
          type: web
          property: host
          envVarKey: NEXT_PUBLIC_QR_BASE_FORMATTED
